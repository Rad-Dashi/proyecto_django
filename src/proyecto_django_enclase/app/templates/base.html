<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    {% load static %}

    <link rel="stylesheet" href="{% static 'app/css/styles.css' %}" />
    <title>{% block title %} {% endblock title %}</title>
  </head>
  <body>
    <nav
      style="
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 10px 20px;
        background-color: #f8f9fa;
        border-bottom: 1px solid #e3e6f0;
        margin-bottom: 20px;
      "
    >
      <!-- Enlaces generales del sitio -->
      <div>
        <a href="{% url 'home' %}">Inicio</a>
        <a href="{% url 'profesores' %}">Profesores</a>
        <a href="{% url 'cursos' %}">Cursos</a>
        <a href="{% url 'estudiantes' %}">Estudiantes</a>
        <a href="{% url 'entregables' %}">Entregables</a>
      </div>
      <!-- Bloque dinámico de Autenticación -->
      <div style="display: flex; align-items: center; gap: 15px">
        {% if user.is_authenticated %}
        <!-- USUARIO LOGUEADO: Ver nombre y botón de salida -->
        <span style="color: #4e73df; font-weight: bold"
          >👤 {{ user.username }}</span
        >

        <form action="{% url 'logout' %}" method="POST" style="margin: 0">
          {% csrf_token %}
          <button
            type="submit"
            style="
              background-color: #e74c3c;
              color: white;
              border: none;
              padding: 6px 12px;
              cursor: pointer;
              font-weight: bold;
              border-radius: 4px;
            "
          >
            🚪 Cerrar Sesión
          </button>
        </form>
        {% else %}
        <!-- VISITANTE ANÓNIMO: Ver botones de acceso -->
        <a
          href="{% url 'login' %}"
          style="
            background-color: #2ecc71;
            color: white;
            text-decoration: none;
            padding: 6px 12px;
            font-weight: bold;
            border-radius: 4px;
          "
        >
          🔑 Iniciar Sesión
        </a>
        <a
          href="{% url 'registro' %}"
          style="
            background-color: #3498db;
            color: white;
            text-decoration: none;
            padding: 6px 12px;
            font-weight: bold;
            border-radius: 4px;
            margin-left: 5px;
          "
        >
          📝 Registrarse
        </a>
        {% endif %}
      </div>
    </nav>
  {% block body %} {% endblock body %}
  </body>
</html>
